# Zeotap Android SDK — build properties.
#
# VERSION_NAME is the single source of the SDK version: stamped into
# BuildConfig.SDK_VERSION (→ context.library.version on every event) and
# asserted equal to the `sdk-android-v*` release tag by CI. Bump it here only.
VERSION_NAME=0.1.0
GROUP=com.zeotap.sdk
POM_ARTIFACT_ID=android-sdk

POM_NAME=Zeotap Android SDK
POM_DESCRIPTION=Zeotap SDK for Android: collects events in Android apps and streams them to Zeotap.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/zeotap/zeotap-pulse-android
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/zeotap/zeotap-pulse-android
POM_SCM_CONNECTION=scm:git:git://github.com/zeotap/zeotap-pulse-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/zeotap/zeotap-pulse-android.git
POM_DEVELOPER_ID=zeotap
POM_DEVELOPER_NAME=Zeotap
POM_DEVELOPER_URL=https://zeotap.com

# Sized for the CI container (and Rosetta on Apple silicon): the Gradle
# daemon, the Kotlin daemon and the Robolectric test JVM all run at once.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1g
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Standalone repository: the conformance vectors live in this tree, not beside it.
zeotap.conformanceDir=conformance/vectors
